name: Node.js Action

on:
  push:
  workflow_dispatch:

jobs:
  nodejs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Node.js
        run: node -e "console.log('Hola desde GitHub Actions con Node.js')"
